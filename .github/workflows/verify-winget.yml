name: Verify Windows winget installation
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate winget
        shell: pwsh
        run: |
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -AllUsers -Force
          $winget = (Get-Command winget -ErrorAction Stop).Source
          $version = (Get-Content version.txt).Trim()
          $manifest = "winget/manifests/j/JeremiahC27/Autotype/$version"
          & $winget validate $manifest --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Manifest validation failed" }
          & $winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw "Could not enable local manifests" }
          & $winget install --manifest $manifest --scope user --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Portable install failed" }
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.WinGetPackageIdentifier -eq 'JeremiahC27.Autotype' })
          if ($entries.Count -ne 1) { throw "Portable package registration missing" }
          $entry = $entries[0]
          if ($entry.DisplayVersion -ne $version -or $entry.DisplayName -ne 'Autotype' -or $entry.Publisher -ne 'Jeremiah-C27') { throw "Portable package metadata mismatch" }
          Write-Host "Verified portable registration: $($entry.DisplayName) $($entry.DisplayVersion)"
          $native = (Get-Command autotype -ErrorAction Stop).Source
          $launch = [System.Diagnostics.ProcessStartInfo]::new()
          $launch.FileName = $native
          $launch.UseShellExecute = $false
          $app = [System.Diagnostics.Process]::Start($launch)
          try {
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              Start-Sleep -Milliseconds 200
              $app.Refresh()
              if ($app.HasExited) { throw "Installed GUI exited unexpectedly" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { break }
            }
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) { throw "Installed GUI did not open" }
            if (-not $app.CloseMainWindow()) { throw "Could not close installed GUI" }
            if (-not $app.WaitForExit(5000)) { throw "Installed GUI did not close" }
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          & $winget uninstall --product-code $entry.PSChildName --source winget --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Portable uninstall failed" }
          if (Test-Path $native) { throw "Portable alias was not removed" }
